# The relay of Phiogy's calls (coturn): where two callers cannot reach
# each other, their sound and picture pass through here. setup.sh fills
# the words in braces and writes this to /etc/turnserver.conf.
#
# The firewall in front of the server must let these in:
#   UDP 3478 and TCP 3478   (callers reach the relay)
#   UDP 49152-49407         (the relayed sound and picture)
listening-port=3478
listening-ip={PRIVATE}
relay-ip={PRIVATE}
external-ip={PUBLIC}/{PRIVATE}
min-port=49152
max-port=49407

# Who may use it: the one name the line hands to pages, with its word.
fingerprint
lt-cred-mech
realm={REALM}
user={USER}:{WORD}

# No certificate is set, so no TLS; nothing to steer it from outside.
no-tls
no-dtls
no-cli
no-multicast-peers

# How much it carries at once.
total-quota=128
user-quota=128
max-bps=2500000

# It relays to callers out on the network and to itself, never to this
# machine's own network or the cloud's addresses for it.
allowed-peer-ip={PRIVATE}
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

syslog
no-software-attribute
