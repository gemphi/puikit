# The whole Phiace platform on one host: Postgres, Phiora (the one API + database) and nginx serving every app
# behind a single origin, /api proxied to Phiora (no CORS). Copy .env.example to .env and fill it in first.
#   node build-all.mjs            # build the apps into dist-all/ (run on the host, needs node)
#   docker compose up -d --build  # bring up db + phiora + web
#   docker compose exec phiora npm run seed   # first start only — load the app data + kinds
# Back up:  docker compose exec db pg_dump -U phi phiora > backup.sql
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phi
      POSTGRES_DB: phiora
      POSTGRES_PASSWORD: ${PHI_PG_PASSWORD:?set PHI_PG_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phi -d phiora"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phiora:
    build:
      context: .
      dockerfile: phiora-server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://phi:${PHI_PG_PASSWORD}@db:5432/phiora
      PHI_ENV: production
      # Security: demo sign-in OFF, secure cookies behind TLS, and the real origins the cookie is scoped to.
      PHI_DEMO_LOGIN: "0"
      PHI_SECURE_COOKIES: "1"
      PHI_ORIGINS: ${PHI_ORIGINS:?set PHI_ORIGINS in .env}
      PHI_PUBLIC_URL: ${PHI_PUBLIC_URL:-}
      PHI_DELEGATION_SECRET: ${PHI_DELEGATION_SECRET:?set PHI_DELEGATION_SECRET in .env}
      # Who may create which kinds. Editors (handles or ids) may create anything; everyone signed in may create
      # the kinds in PHI_CREATE_KINDS (comment/order let people talk and back rounds; unset = all kinds open).
      PHI_EDITORS: ${PHI_EDITORS:-}
      # Work sync: who may see and manage the work machines (handles or ids, comma-separated).
      PHI_ADMINS: ${PHI_ADMINS:-}
      PHI_CREATE_KINDS: ${PHI_CREATE_KINDS:-comment,order}
      # Mail (account verification / password reset) via Resend.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PHI_MAIL_FROM: ${PHI_MAIL_FROM:-}
      # The chat model proxy (optional): provider/key/url for the apps' Talk/chat.
      PHI_MODEL_PROVIDER: ${PHI_MODEL_PROVIDER:-}
      PHI_MODEL: ${PHI_MODEL:-}
      PHI_MODEL_KEY: ${PHI_MODEL_KEY:-}
      PHI_MODEL_URL: ${PHI_MODEL_URL:-}
      # Calls: with both set, Phiora keeps no rooms and passes /call to Phiogy's line (the service below), saying who
      # each page belongs to. The key is a word the two share; the ICE list is what a page is told to find a way by.
      PHI_CALL_LINE: ${PHI_CALL_LINE:-}
      PHI_CALL_KEY: ${PHI_CALL_KEY:-}
      PHI_CALL_ICE: ${PHI_CALL_ICE:-}
    volumes:
      - phioradata:/data
    restart: unless-stopped

  # Phiogy's call line, in Rust (phikit: crates/appkit/app/phiogy, `phiogy --line`): who is in each room's call, and
  # their signals passed on. It shares Phiora's network, so the two speak over that container's own loopback
  # (PHI_CALL_LINE=http://127.0.0.1:4310) and nothing of it is opened to the outside. The image is built from phikit:
  #   bash crates/appkit/app/phiogy/script/ship.sh ubuntu@HOST KEY     (on the machine with the source)
  #   docker build -f crates/appkit/app/phiogy/Dockerfile -t phiogy-line .   (on the server, in gemphi/phikit)
  # It is brought up by name, after Phiora:  docker compose up -d phiogy
  phiogy:
    image: phiogy-line
    network_mode: "service:phiora"
    depends_on: [phiora]
    environment:
      PHI_CALL_KEY: ${PHI_CALL_KEY:-}
      PHI_CALL_ICE: ${PHI_CALL_ICE:-}
    restart: unless-stopped

  # phiadk — the platform container (Python). Phiora, its FastAPI data engine, answers
  # /api/kind/{...} over the same database. Layers of concern: puikit is UI only — the engine and
  # the agents live in the phiadk repo, checked out beside this one (Workspace/gemphi/{puikit,phiadk}).
  # nginx routes /api/ here when the apps are built with:  node build-all.mjs --backend python
  phiadk:
    build:
      context: ../../phiadk/phiora
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://phi:${PHI_PG_PASSWORD}@db:5432/phiora
      PHI_DEMO_LOGIN: "0"
      PHI_SECURE_COOKIES: "1"
      PHI_EDITORS: ${PHI_EDITORS:-}
      # Work sync: who may see and manage the work machines (handles or ids, comma-separated).
      PHI_ADMINS: ${PHI_ADMINS:-}
      PHI_CREATE_KINDS: ${PHI_CREATE_KINDS:-comment,order}
    restart: unless-stopped

  # Planned sibling containers, one concern each (uncomment as their services land):
  # phient:   # the agent runtime — the ollama of phiadk: `phient serve` on :4500
  #   build: { context: ../../phiadk }
  #   command: ["phient", "serve", "--port", "4500"]
  # phinet:   # models — serving/inference
  #   build: { context: ../../phinet }
  # phiace:   # 3D, simulation and spatial
  #   build: { context: ../../phiace }

  web:
    image: nginx:alpine
    depends_on: [phiora]
    ports:
      - "${PHI_PORT:-8080}:80"
    volumes:
      - ./dist-all:/usr/share/nginx/html:ro
      - ./dist-all/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
  phioradata:
